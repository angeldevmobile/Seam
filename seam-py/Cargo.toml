[package]
name = "seam-py"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Python bindings for the Seam validation engine."

[lib]
name = "_seam"
crate-type = ["cdylib"]

[dependencies]
seam-core = { path = "../seam-core" }
# abi3-py39 builds one wheel per platform that works on every CPython from 3.9
# up, instead of one per interpreter version.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
