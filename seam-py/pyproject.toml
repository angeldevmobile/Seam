[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "seam-schema"
requires-python = ">=3.9"
description = "One schema. Every language. No drift."
keywords = ["schema", "validation", "json", "cross-language", "contract"]
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dynamic = ["version"]

dependencies = ["typing_extensions>=4.6; python_version < '3.11'"]

[project.scripts]
seam = "seam_schema.cli:main"

[project.urls]
Repository = "https://github.com/angeldevmobile/Seam"

[project.optional-dependencies]
test = ["pytest>=7", "mypy>=1.8"]

[tool.maturin]
module-name = "seam_schema._seam"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
