[package]
name = "seam-wasm"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for the Seam validation engine."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
seam-core = { path = "../seam-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# `opt-level = "z"` rather than 3: this is downloaded over a network before it
# runs, so bytes are the cost that matters, not the last few percent of speed.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
