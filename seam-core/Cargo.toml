[package]
name = "seam-core"
description = "The Seam validation engine: .seam parsing, schema compilation, and validation."
readme = "README.md"
keywords = ["schema", "validation", "json", "cross-language", "contract"]
categories = ["parser-implementations", "encoding", "data-structures"]

# These two read `../conformance`, which is not part of the crate. Shipping a
# test that cannot run is worse than shipping none: `unions.rs` is
# self-contained and `fuzz.rs` degrades to its built-in seeds, so both stay.
exclude = ["tests/conformance.rs", "tests/schemas.rs"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# seam-core has no dependencies, on purpose.
#
# It is loaded into Python, Node, the browser and (later) the JVM. Every
# transitive dependency is a dependency those hosts inherit, and a supply-chain
# surface for a crate whose whole job is to be trustworthy about untrusted
# input. Date handling is implemented here rather than pulled in for the same
# reason; typed conversion to chrono/`datetime`/`Instant` happens in the
# bindings, where the host type system actually lives.
[dependencies]

# Test-only. `arbitrary_precision` keeps the number literal as text instead of
# routing it through f64, which is the property the conformance suite exists to
# check: the runner must not corrupt an integer on the way in.
[dev-dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }

[lints]
workspace = true
